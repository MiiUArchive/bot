name: MiiUArchive Master Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Git Identity & Sync Mirrors
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          git config --global user.name "MiiUArchive Bot"
          git config --global user.email "bot@miiuarchive.l.cd"

          [ -f "SOURCES" ] || { echo "[Error] SOURCES file not found!"; exit 1; }

          git clone https://x-access-token:${GH_TOKEN}@github.com/miiuarchive/mirrors.git temp_mirrors
          cd temp_mirrors

          while read -r URL || [ -n "$URL" ]; do
            [[ -z "$URL" || "$URL" =~ ^# ]] && continue
            URL=$(echo "$URL" | xargs)

            PATH_REPO="${URL#https://github.com/}"
            PATH_REPO="${PATH_REPO#http://github.com/}"
            PATH_REPO="${PATH_REPO%.git}"
            [ -z "$PATH_REPO" ] && continue

            echo "-> Syncing Mirror: $PATH_REPO"
            mkdir -p "$(dirname "$PATH_REPO")"

            if [ -d "$PATH_REPO/.git" ]; then
              git --git-dir="$PATH_REPO" remote update --prune || echo "[Warning] Update failed for $PATH_REPO"
            else
              git clone --mirror "$URL" "$PATH_REPO"
            fi
          done < ../SOURCES

          git add .
          git diff --staged --quiet || (git commit -m "[Bot]: Sync mirrors [$(date -u +'%Y-%m-%d')]" && git push origin main)

  sync-releases:
    needs: sync-mirrors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Git Identity & Fetch Releases
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          git config --global user.name "MiiUArchive Bot"
          git config --global user.email "bot@miiuarchive.l.cd"

          [ -f "SOURCES" ] || { echo "[Error] SOURCES file not found!"; exit 1; }

          git clone https://x-access-token:${GH_TOKEN}@github.com/miiuarchive/releases.git temp_releases
          cd temp_releases

          while read -r URL || [ -n "$URL" ]; do
            [[ -z "$URL" || "$URL" =~ ^# ]] && continue
            URL=$(echo "$URL" | xargs)

            REPO_PATH="${URL#https://github.com/}"
            REPO_PATH="${REPO_PATH#http://github.com/}"
            REPO_PATH="${REPO_PATH%.git}"
            [ -z "$REPO_PATH" ] && continue

            echo "-> Checking Releases: $REPO_PATH"
            TAGS=$(gh release list --repo "$REPO_PATH" --limit 50 2>/dev/null | awk -F'\t' '{print $3}' || true)
            [ -z "$TAGS" ] && continue

            for TAG in $TAGS; do
              [ -z "$TAG" ] && continue
              TARGET_DIR="$REPO_PATH/$TAG"
              mkdir -p "$TARGET_DIR"
              
              gh release download "$TAG" --repo "$REPO_PATH" --dir "$TARGET_DIR" --clobber 2>/dev/null || true
              gh release download "$TAG" --repo "$REPO_PATH" --archive=zip --dir "$TARGET_DIR" --clobber 2>/dev/null || true
              find "$TARGET_DIR" -type d -empty -delete
            done
            
            find "$REPO_PATH" -type d -empty -delete
          done < ../SOURCES

          git add .
          git diff --staged --quiet || (git commit -m "[Bot]: Sync releases [$(date -u +'%Y-%m-%d')]" && git push origin main)

  finalize-sync:
    needs: sync-releases
    runs-on: ubuntu-latest
    steps:
      - run: echo "All synchronization tasks completed successfully!"
